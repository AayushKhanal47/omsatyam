<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#173404"
    />

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- Primary SEO -->
    <title>
      Dental Supplier in Nepal | Om Satyam Dental & Surgical
    </title>

    <meta
      name="description"
      content="Om Satyam Dental & Surgical supplies quality dental and surgical products across Nepal, including dental instruments, consumables, materials and equipment from trusted brands."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://www.omsatyam.com/"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Om Satyam Dental & Surgical"
    />

    <meta
      property="og:title"
      content="Dental Supplier in Nepal | Om Satyam Dental & Surgical"
    />

    <meta
      property="og:description"
      content="Quality dental and surgical supplies for clinics, dentists and healthcare professionals across Nepal."
    />

    <meta
      property="og:url"
      content="https://www.omsatyam.com/"
    />

    <meta
      property="og:image"
      content="https://www.omsatyam.com/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Om Satyam Dental & Surgical"
    />

    <meta
      property="og:locale"
      content="en_NP"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Dental Supplier in Nepal | Om Satyam Dental & Surgical"
    />

    <meta
      name="twitter:description"
      content="Quality dental and surgical supplies for clinics, dentists and healthcare professionals across Nepal."
    />

    <meta
      name="twitter:image"
      content="https://www.omsatyam.com/logo.png"
    />

    <!-- Local Business / Store Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "@id": "https://www.omsatyam.com/#store",
      "name": "Om Satyam Dental & Surgical",
      "url": "https://www.omsatyam.com/",
      "logo": "https://www.omsatyam.com/logo.png",
      "description": "Dental and surgical supplies for clinics, dentists and healthcare professionals across Nepal.",
      "areaServed": {
        "@type": "Country",
        "name": "Nepal"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bharatpur",
        "addressRegion": "Chitwan",
        "addressCountry": "NP"
      }
    }
    </script>

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
